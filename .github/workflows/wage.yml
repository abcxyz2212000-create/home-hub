# Yearly (1 December, Japan time): remind the administrators to set next year's ratio of the budget
# from the wage statistics (厚生労働省 賃金構造基本統計調査), with what to look up.
# Required repository secrets: SUPABASE_SERVICE_ROLE_KEY, VAPID_PRIVATE_KEY.
# Logs of a public repository are public: scripts/wage.mjs never prints names or ages.
name: 負担率の確認（毎年12月）

on:
  schedule:
    - cron: '23 0 1 12 *'
  workflow_dispatch:
    inputs:
      budget_year:
        description: 予算の年（空欄なら来年）
        required: false
        default: ''

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remind
        run: node scripts/wage.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          BUDGET_YEAR: ${{ github.event.inputs.budget_year }}
