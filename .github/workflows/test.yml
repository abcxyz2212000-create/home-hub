# Unit tests (Node.js built-ins only) and database/RLS tests on a throwaway PostgreSQL. When main changes
# and the tests pass, web/ is published to Cloudflare Pages (project "househub"). Publishing is the
# deployment of this repository's software, an allowed use of GitHub Actions (docs/terms.md).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in web/js/*.js web/sw.js scripts/*.mjs; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Database and RLS tests
        run: sh tests/sql/run.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

  # One-time setup: repository Settings -> Secrets and variables -> Actions:
  #   CLOUDFLARE_API_TOKEN   API token with only "Account - Cloudflare Pages - Edit"
  #   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish web/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in the repository secrets"
            exit 1
          fi
          npx --yes wrangler@4.156.0 pages deploy web --project-name=househub --branch=main --commit-hash="$GITHUB_SHA"
